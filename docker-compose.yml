# DevBug Tracker - Local Self-Hosted PostgreSQL & Supabase Services
# Usage:
#   docker compose up -d
#   npm run setup

services:
  db:
    image: supabase/postgres:15.6.1.139
    container_name: devbug-tracker-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
